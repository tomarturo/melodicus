<!DOCTYPE html>

  <head>

    <!-- Favicons. Browsers that support SVG icons take favicon.svg, which turns
         ink or off-white with the system's light or dark mode. Safari takes the
         PNG: the mark on an ink tile, readable on either. The PNGs are drawn
         by scripts/app-icons/render.mjs. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />

<meta name="description" content="Learn the songs &amp; licks you love with Melodicus. Any song on YouTube. Unlimited loops. Slow down the hard parts." />

<!-- Open Graph / Facebook -->

<meta property="og:title" content="Melodicus - Learn the songs &amp; licks you love" />
<meta property="og:description" content="Any song on YouTube. Unlimited loops. Slow down the hard parts." />
