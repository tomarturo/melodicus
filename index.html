<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    
    <!-- Favicon for browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E9E8E4" />
    <!--
      Applies the saved light/dark/system choice before anything paints, so a
      dark-mode visitor never sees a light flash. Mirrors src/theme/colorMode.ts.
    -->
    <script>
      (function () {
        var mode = 'system';
        try {
          var stored = localStorage.getItem('melodicus:v1:color-mode');
          if (stored === 'light' || stored === 'dark') mode = stored;
        } catch (e) {}
        if (mode === 'system') mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var root = document.documentElement;
        root.dataset.theme = mode;
        root.style.colorScheme = mode;
        document.querySelector('meta[name="theme-color"]').setAttribute('content', mode === 'dark' ? '#141517' : '#E9E8E4');
      })();
    </script>
    <style>
      html, body { background-color: #E9E8E4; }
      html[data-theme='dark'], html[data-theme='dark'] body { background-color: #141517; }
    </style>
    
    <!-- SEO Meta Tags -->
<meta name="description" content="Melodicus: Learn the songs you love with uninterrupted loops, controlled playback, and zero distractions." />
<meta name="keywords" content="music learning, guitar tabs, song loops, music practice, learn songs" />

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://melodicus.vercel.app/" />
<meta property="og:title" content="Melodicus - Learn the songs you love" />
<meta property="og:description" content="Uninterrupted loops. Controlled playback. Zero distractions." />
<meta property="og:image" content="https://melodicus.vercel.app/og-image.png" />

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image" />
<meta property="twitter:url" content="https://melodicus.vercel.app/" />
<meta property="twitter:title" content="Melodicus - Learn the songs you love" />
<meta property="twitter:description" content="Uninterrupted loops. Controlled playback. Zero distractions." />
<meta property="twitter:image" content="https://melodicus.vercel.app/og-image.png" />
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <title>Melodicus - Learn the songs you love</title>
  </head>
  <body>
    <noscript>Enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
